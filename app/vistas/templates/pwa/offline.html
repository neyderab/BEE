<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFDF35">
    <title>Sin conexión | Bee</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               padding: 24px; box-sizing: border-box; background: #f7f7f2; color: #202019;
               font-family: Arial, Helvetica, sans-serif; text-align: center; }
        main { max-width: 360px; }
        img { border-radius: 24px; }
        h1 { font-size: 26px; margin: 20px 0 8px; }
        p { color: #6d6d64; line-height: 1.6; }
        button { margin-top: 18px; width: 100%; padding: 15px; border: none; border-radius: 12px;
                 background: #202019; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/static/pwa/icono-192.png" alt="" width="88" height="88">
        <h1>Sin conexión</h1>
        <p>Bee necesita internet para mostrar las tiendas y tus pedidos. Revisa tu conexión e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
