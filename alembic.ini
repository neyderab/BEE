# Configuración de Alembic (migraciones de la base de datos).
# Los datos de conexión salen del .env (ver migraciones/env.py).
#
#   alembic upgrade head                    aplica las migraciones pendientes
#   alembic revision -m "descripción"       crea una migración nueva
#
# La aplicación aplica las migraciones sola al arrancar.
[alembic]
script_location = %(here)s/migraciones
version_locations = %(here)s/migraciones/versiones
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = consola

[formatters]
keys = simple

[logger_root]
level = WARNING
handlers = consola

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
formatter = simple

[formatter_simple]
format = %(levelname)s %(name)s: %(message)s
