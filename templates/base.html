<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Bee{% endblock %} | Bee</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2">
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#FFDF35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bee">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="{{ estatico('styles.css') }}">
</head>
<body class="{% block clase_body %}{% endblock %}">
{% block cuerpo %}{% endblock %}
<script>
    // App instalable: registra el service worker (pantalla "Sin conexión" e íconos).
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});
</script>
</body>
</html>
