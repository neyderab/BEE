
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | BEE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f2;
            color: #202019;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .contenedor {
            width: 100%;
            max-width: 1000px;
            min-height: 580px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
        }

        .presentacion {
            background: #ffdf35;
            padding: 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .logo span {
            color: white;
        }

        .mensaje h1 {
            font-size: clamp(34px, 4vw, 52px);
            line-height: 1.08;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .mensaje p {
            font-size: 16px;
            line-height: 1.7;
            max-width: 340px;
        }

        .decoracion {
            font-size: 68px;
            margin-top: 30px;
        }

        .pie {
            font-size: 12px;
            color: #514b22;
        }

        .formulario {
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .formulario h2 {
            font-size: 32px;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .descripcion {
            color: #77776f;
            line-height: 1.6;
            margin-bottom: 35px;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .telefono {
            display: flex;
            align-items: center;
            border: 1px solid #deded7;
            border-radius: 12px;
            padding: 0 14px;
            margin-bottom: 22px;
            transition: border-color 0.2s;
        }

        .telefono:focus-within {
            border-color: #c5a400;
        }

        .prefijo {
            color: #55554d;
            padding-right: 12px;
            border-right: 1px solid #deded7;
            font-size: 15px;
        }

        input {
            width: 100%;
            border: none;
            outline: none;
            padding: 16px 12px;
            font-size: 15px;
            background: transparent;
        }

        .boton {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            background: #202019;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .boton:hover {
            background: #3b3b30;
            transform: translateY(-1px);
        }

        .registro {
            text-align: center;
            font-size: 14px;
            color: #77776f;
            margin-top: 25px;
        }

        .registro a {
            color: #202019;
            font-weight: bold;
            text-decoration: none;
        }

        .registro a:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            body {
                padding: 14px;
            }

            .contenedor {
                grid-template-columns: 1fr;
                max-width: 430px;
            }

            .presentacion {
                padding: 28px;
                min-height: 235px;
            }

            .mensaje h1 {
                font-size: 34px;
                margin-top: 28px;
            }

            .mensaje p {
                font-size: 14px;
            }

            .decoracion {
                display: none;
            }

            .pie {
                margin-top: 25px;
            }

            .formulario {
                padding: 35px 26px;
            }

            .formulario h2 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <main class="contenedor">

        <section class="presentacion">
            <div class="logo">BEE<span>.</span></div>

            <div class="mensaje">
                <h1>Pide antes.<br>Recoge sin fila.</h1>
                <p>
                    Tu tiempo vale. Elige lo que quieres,
                    haz tu pedido y recógelo cuando esté listo.
                </p>
                <div class="decoracion">🐝</div>
            </div>

            <p class="pie">Una forma más fácil de disfrutar tu universidad.</p>
        </section>

        <section class="formulario">
            <h2>¡Hola de nuevo!</h2>
            <p class="descripcion">
                Ingresa tu número de teléfono para continuar con BEE.
            </p>

            <form action="/login" method="post">
                <label for="telefono">Número de teléfono</label>

                <div class="telefono">
                    <span class="prefijo">+57</span>
                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="300 123 4567"
                        autocomplete="tel-national"
                        inputmode="numeric"
                        pattern="[0-9]{10}"
                        minlength="10"
                        maxlength="10"
                        required
                    >
                </div>

                <button class="boton" type="submit">
                    Continuar
                </button>
            </form>

            <p class="registro">
                ¿Todavía no tienes cuenta?
                <a href="/registro">Crear cuenta</a>
            </p>
        </section>

    </main>
</body>
</html>
