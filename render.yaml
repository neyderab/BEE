# Configuración para publicar Bee en Render (https://render.com).
# En Render: New → Blueprint → elige este repositorio. Después completa las
# variables DB_* con los datos de la base PostgreSQL que ya usan.
services:
  - type: web
    name: bee
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SEGURA
        value: "1"
      - key: DB_SSLMODE
        value: require
      - key: DB_PORT
        value: "5432"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # Notificaciones push: créalas con  python scripts/generar_claves_push.py
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
